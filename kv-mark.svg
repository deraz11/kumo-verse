<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="KUMO VERSE mark">
  <title>K/V Mark</title>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" stroke="#F4F1EA" stroke-opacity="0.15" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="84" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- Web -->
  <path d="M100 20 L100 180 M20 100 L180 100 M40 40 L160 160 M160 40 L40 160 M55 25 L145 175 M145 25 L55 175 M25 55 L175 145 M175 55 L25 145"
        stroke="#F4F1EA" stroke-opacity="0.12" stroke-width="1"/>
  <!-- Spider body -->
  <ellipse cx="100" cy="112" rx="14" ry="22" fill="#E62429"/>
  <ellipse cx="100" cy="86" rx="11" ry="13" fill="#E62429"/>
  <!-- Eyes -->
  <path d="M92 84 L96 78 L100 84 L104 78 L108 84" fill="none" stroke="#F4F1EA" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M95 76 L72 58 L58 32 M94 82 L58 72 L44 46 M94 90 L54 100 L40 138 M95 96 L68 122 L60 168
           M105 76 L128 58 L142 32 M106 82 L142 72 L156 46 M106 90 L146 100 L160 138 M105 96 L132 122 L140 168"
        stroke="#E62429" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cyan ghost spider offset -->
  <g opacity="0.55" transform="translate(2.5 2)">
    <ellipse cx="100" cy="112" rx="14" ry="22" fill="#00E5FF"/>
    <ellipse cx="100" cy="86" rx="11" ry="13" fill="#00E5FF"/>
    <path d="M95 76 L72 58 L58 32 M94 82 L58 72 L44 46 M94 90 L54 100 L40 138 M95 96 L68 122 L60 168
             M105 76 L128 58 L142 32 M106 82 L142 72 L156 46 M106 90 L146 100 L160 138 M105 96 L132 122 L140 168"
          stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Center diamond -->
  <path d="M96 108 H104 L100 118 L104 128 H96 L100 118 Z" fill="#F4F1EA"/>
</svg>

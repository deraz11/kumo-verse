<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" fill="none" role="img" aria-label="KUMO VERSE badge">
  <title>KUMO // VERSE Badge</title>
  <!-- Outer rings -->
  <circle cx="110" cy="110" r="104" stroke="#F4F1EA" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="110" cy="110" r="96" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="110" cy="110" r="88" stroke="#E62429" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>
  <!-- Center disc -->
  <circle cx="110" cy="110" r="52" fill="#0F1115" stroke="#F4F1EA" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Monogram -->
  <text x="110" y="122" text-anchor="middle" font-family="Space Grotesk, Arial Black, sans-serif" font-weight="700" font-size="36" fill="#E62429">K/V</text>
  <!-- Circular text top -->
  <defs>
    <path id="topArc" d="M 30 110 A 80 80 0 0 1 190 110"/>
    <path id="botArc" d="M 190 110 A 80 80 0 0 1 30 110"/>
  </defs>
  <text font-family="Space Grotesk, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="4" fill="#F4F1EA">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">KUMO // VERSE</textPath>
  </text>
  <text font-family="Space Grotesk, Arial, sans-serif" font-weight="600" font-size="10" letter-spacing="3" fill="#00E5FF">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">DROP 01  •  クモ</textPath>
  </text>
</svg>
